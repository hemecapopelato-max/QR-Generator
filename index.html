<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore di QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generatore di QR Code</h1>
        <div class="input-group">
            <input type="text" id="qr-text" placeholder="Inserisci testo o link">
            <button id="generate-btn">Genera</button>
        </div>
        <div id="qr-code-container" class="qr-container">
            <!-- Il QR Code apparirà qui -->
        </div>
        <div id="download-container" class="download-container" style="display: none;">
            <button id="download-btn">Scarica QR Code</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
